# USM-AA 100M Fine-tuning Configuration
# For GUE classification tasks

# Training mode
mode: finetune

# Data configuration
data:
  # Dataset type: dense | dense_aa | non_contiguous
  dataset_type: dense_aa
  
  # Data file paths (JSONL format)
  train_file: ../data/gue/virus/covid/train.jsonl
  dev_file: ../data/gue/virus/covid/dev.jsonl
  test_file: ../data/gue/virus/covid/test.jsonl
  
  # Sequence parameters
  max_len: 512
  
  # Number of classes
  num_classes: 9

#classification/regression/mlm
loss: 
  name: classification


# Model configuration
model:
  name: USMAAForSequenceClassification
  type: usm-aa-100m
  # Pretrained checkpoint path (safetensors or pt)
  checkpoint: /apdcephfs_qy3/share_301997302/chenchenqin/buddy2/yangxu/aigp/projects/aabert/100m/weight/model.safetensors
  # Freeze encoder layers (optional)
  freeze_encoder: false

tokenizer:
  kmer: 6
  dynamic: true
  special_tokens:
    - <pad>
    - <mask>
    - <R1>
    - <R2>
    - <R3>
    - <R4>
    - <R5>
    - <R6>
    - <R7>
    - <R8>
    - <R9>
    - <R10>
    - <R11>
    - <R12>
    - <R13>
    - <R14>
    - <R15>
    - <R16>
    - <R17>

# Training configuration
training:
  batch_size: 32
  num_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip: 1.0
  label_smoothing: 0.0
  early_stopping_patience: 15
  eval_freq: none 
  best_metric: f1

# Evaluator configuration
evaluator:
  # Evaluator type: classification | regression
  type: classification
  threshold: null  # null = argmax, 或设置如 0.5
  # Batch size for evaluation (default: 2x training batch_size)
  batch_size: 64
  # Number of workers for evaluation dataloader
  num_workers: 4

# DataLoader configuration
dataloader:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true

# Precision configuration
precision:
  bf16: true
  fp16: false
  activation_checkpoint: false

# Logging and checkpointing
logging:
  output_dir: ../models/usm-aa-100m-virus
  log_freq: 10
  save_best_only: true

# Distributed training
distributed:
  backend: nccl

# DeepSpeed configuration
deepspeed:
  bfloat16:
    enabled: true
  fp16:
    enabled: false
  gradient_clipping: 1.0
  prescale_gradients: false
  steps_per_print: 1000
  zero_allow_untested_optimizer: true
  zero_optimization:
    stage: 1
    contiguous_gradients: true
    overlap_comm: true
    reduce_scatter: true
  wall_clock_breakdown: false
