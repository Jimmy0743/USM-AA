# USM-AA 100M Pretraining Configuration

# Dataset configuration
dataset:
  # Dataset type: RefseqPretrainDataset | DNAPretrainDataset | Discrete1KGPretrainDataset | USMAAPretrainDataset
  type: USMAAPretrainDataset
  
  # Data file paths (comment out or remove paths that don't exist)
  train:
    ref_file: ../data/reference/ref.fasta
    # dna_file: path/to/dna.jsonl      # Uncomment and set path when data is ready
    # n1kg_file: path/to/1kg.jsonl     # Uncomment and set path when data is ready
  
  
  # Sequence parameters
  seq_len: 256
  
  # Sampling weights for each data source (combined mode only)
  sample_weights:
    ref: 0.15    # Reference genome sampling weight
    dna: 0.40
    n1kg: 0.45

loss:
  name: mlm
  
# Model configuration
model:
  name: USMAAModel
  type: usm-aa-100m  
  # - usm-aa-100m: num_layers=12, num_heads=12, embedding_dim=768, ffn_dim=4096, use_gate=True (~122M)
  # - usm-aa-1b: num_layers=36, num_heads=32, embedding_dim=1536, ffn_dim=8192, use_gate=True (~1B)

# Tokenizer configuration
tokenizer:
  kmer: 6
  dynamic: true
  special_tokens:
    - <pad>
    - <mask>
    - <R1>
    - <R2>
    - <R3>
    - <R4>
    - <R5>
    - <R6>
    - <R7>
    - <R8>
    - <R9>
    - <R10>
    - <R11>
    - <R12>
    - <R13>
    - <R14>
    - <R15>
    - <R16>
    - <R17>
    

# Training configuration
training:
  batch_size: 320       # Per GPU batch size
  num_epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 0.1
  warmup_steps: 10000
  grad_clip: 1.0
  mask_ratio: 0.15      # MLM mask ratio
  rc_ratio: 0.3         # Reverse complement ratio

optimizer:
  type: AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8

dataloader:
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

precision:
  bf16: true           
  fp16: false
  activation_checkpoint: true  

# Logging and checkpointing
logging:
  output_dir: ../models/usm-aa-100m-pretrain
  log_freq: 5
  save_freq: 2000       

# Distributed training
distributed:
  backend: nccl

# DeepSpeed configuration
deepspeed:
  bfloat16:
    enabled: true
  fp16:
    enabled: false
  data_sampling:
    enabled: true
  gradient_clipping: 0.5
  prescale_gradients: false
  steps_per_print: 1000
  tensorboard:
    enabled: true
  zero_allow_untested_optimizer: true
  zero_optimization:
    stage: 1
    contiguous_gradients: true
    overlap_comm: true
    reduce_scatter: true
  wall_clock_breakdown: false
