# USM-AA 1B Pretraining Configuration
# Standalone implementation without tgnn dependency

# Data configuration
data:
  # Dataset type: refseq | dna | 1kg | combined
  # - refseq: Reference genome only (RefseqPretrainDataset)
  # - dna: Multi-species DNA only (DNAPretrainDataset)
  # - 1kg: 1000 Genomes variants only (Discrete1KGPretrainDataset)
  # - combined: All available data sources (USMAAPretrainDataset)
  dataset_type: refseq
  
  # Data file paths
  ref_file: path/to/hg38.fa
  dna_file: null  # /path/to/dna.jsonl
  n1kg_file: null  # /path/to/1kg.jsonl
  
  # Sequence parameters
  seq_len: 256
  
  # Sampling weights for each data source (combined mode only)
  # Higher weight = more samples from that source
  sample_weights:
    ref: 1.0    # Reference genome sampling weight

# Model configuration
model:
  type: usm-aa-100m  # usm-aa-100m, usm-aa-500m, usm-aa-1b
  # Auto-configured parameters:
  # - usm-aa-100m: num_layers=12, num_heads=12, embedding_dim=768, ffn_dim=4096, use_gate=True (~122M)
  # - usm-aa-500m: num_layers=24, num_heads=20, embedding_dim=1280, ffn_dim=6912, use_gate=True (~500M)
  # - usm-aa-1b: num_layers=36, num_heads=32, embedding_dim=1536, ffn_dim=8192, use_gate=True (~1B)

# Tokenizer configuration
tokenizer:
  kmer: 6
  dynamic: true
  special_tokens:
    - <pad>
    - <mask>
    - <INS-S>
    - <INS-E>
    - <DEL-S>
    - <DEL-E>
    - <DUP-S>
    - <DUP-E>
    - <INV-S>
    - <INV-E>
    - <TRA-S>
    - <TRA-E>
    - <5mC>
    - <R1>
    - <R2>
    - <R3>
    - <R4>
    - <R5>
    - <R6>

# Training configuration
training:
  batch_size: 80        # Per GPU batch size
  num_epochs: 20
  learning_rate: 1.0e-4
  weight_decay: 0.1
  warmup_steps: 10000
  grad_clip: 1.0
  mask_ratio: 0.15      # MLM mask ratio
  rc_ratio: 0.3         # Reverse complement ratio

# DataLoader configuration
dataloader:
  num_workers: 8
  prefetch_factor: 2
  pin_memory: true

# Precision configuration
precision:
  bf16: true           # Recommended to use bf16
  fp16: false
  activation_checkpoint: true  # Save memory

# Logging and checkpointing
logging:
  output_dir: ../models/usm-aa-100m
  log_freq: 5
  save_freq: 100       # Save checkpoint every N steps

# Distributed training
distributed:
  backend: nccl
